<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LaunchVelocity Companion</title>
  <style>
    /* Minimal, single-purpose popup.
       Intentionally lean: brand, connection status, one primary action,
       one secondary toggle. The full dashboard lives at localhost:3000. */

    :root {
      --bg: #ffffff;
      --surface-soft: #f9fafb;
      --border: #e5e7eb;
      --text: #111827;
      --text-soft: #6b7280;
      --text-mute: #9ca3af;
      --primary: #111827;
      --primary-hover: #1f2937;
      --success: #059669;
      --success-soft: #d1fae5;
      --warning: #d97706;
      --warning-soft: #fef3c7;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
    }

    header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      width: 32px; height: 32px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      display: grid; place-items: center;
    }
    .brand-logo svg { width: 16px; height: 16px; }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-mute);
      margin-top: 1px;
    }

    .container {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* connection status row */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .status-dot.idle      { background: var(--text-mute); }
    .status-dot.paused    { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-soft); }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .status-sub {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 1px;
    }

    /* Primary action */
    .btn {
      height: 40px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--surface-soft); }

    .btn svg { width: 14px; height: 14px; }

    /* Pause toggle (smaller) */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }
    .toggle-label {
      font-size: 12px;
      color: var(--text-soft);
    }
    .toggle {
      position: relative;
      width: 34px; height: 20px;
      background: #d1d5db;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .toggle.on { background: var(--success); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    .toggle.on::after { transform: translateX(14px); }

    footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-mute);
    }
    footer a {
      color: var(--text-mute);
      text-decoration: none;
    }
    footer a:hover { color: var(--text-soft); text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7v8l10-12h-7z"/></svg>
    </div>
    <div>
      <div class="brand-name">LaunchVelocity</div>
      <div class="brand-sub">Engagement assistant</div>
    </div>
  </header>

  <div class="container">

    <!-- Connection status -->
    <div class="status-row">
      <div id="statusDot" class="status-dot idle"></div>
      <div>
        <div id="statusText" class="status-text">Checking dashboard…</div>
        <div id="statusSub" class="status-sub">Open the dashboard to start drafting replies.</div>
      </div>
    </div>

    <!-- Primary action -->
    <button id="openApp" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      Open dashboard
    </button>

    <!-- Pause monitoring toggle -->
    <div class="toggle-row">
      <span class="toggle-label">Watch tracked accounts</span>
      <div id="watchToggle" class="toggle on" role="switch" aria-checked="true" tabindex="0"></div>
    </div>
  </div>

  <footer>
    <span>v2.0.0</span>
    <a id="helpLink" href="#" target="_blank">Help</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
